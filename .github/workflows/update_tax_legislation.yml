name: "Automatická kontrola a měsíční připomínka daňové legislativy"

on:
  schedule:
    # Běží každou neděli v 9:00 UTC (rezerva pro keep-alive proti případnému vynechání běhu; keep-alive zapisuje až po 35 dnech a e-mail chodí max 1× měsíčně)
    - cron: '0 9 * * 0'
  # Umožňuje spustit kontrolu a test připomínky kdykoliv ručně jedním kliknutím v záložce Actions
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  check-tax-legislation:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout kód repozitáře
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Měsíční keep-alive (ochrana před 60denním vypnutím Actions)
        run: |
          LAST_COMMIT_TS=$(git log -1 --format=%ct)
          NOW_TS=$(date +%s)
          AGE_DAYS=$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))
          echo "Stáří posledního commitu na main: ${AGE_DAYS} dní"
          if [ "$AGE_DAYS" -ge 35 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: měsíční kontrola legislativy (keep-alive)"
            git push origin HEAD:main
          fi

      - name: Zkontrolovat legislativní parametry pro cílový rok
        id: tax_check
        run: |
          python3 - << 'EOF'
          import datetime
          import json
          import math
          import re
          import urllib.request

          filepath = "tax_constants.json"
          with open(filepath, "r", encoding="utf-8") as f:
              data = json.load(f)

          by_year = {item["year"]: item for item in data}
          now = datetime.datetime.now(datetime.timezone.utc)
          current_year = now.year
          # Od září do prosince připravujeme nadcházející rok; v lednu–srpnu hlídáme, zda nechybí rok běžící
          target_year = current_year + 1 if now.month >= 9 else current_year

          def write_flag(name, value):
              with open(name, "w", encoding="utf-8") as out:
                  out.write(value)

          def probe_official_snippet(url, pattern):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "KapesniUcetni-LegislationCheck/1.0"})
                  with urllib.request.urlopen(req, timeout=8) as resp:
                      html = resp.read().decode("utf-8", errors="ignore")
                  text = re.sub(r"<[^>]+>", " ", html)
                  text = re.sub(r"\s+", " ", text)
                  m = re.search(pattern, text, flags=re.IGNORECASE)
                  if m:
                      start = max(0, m.start() - 80)
                      end = min(len(text), m.end() + 180)
                      return text[start:end].strip()
              except Exception:
                  pass
              return None

          existing = by_year.get(target_year)
          if existing and existing.get("isEnacted") is True:
              print(f"Rok {target_year} je již schválený (isEnacted: true).")
              write_flag("has_pending.txt", "false")
              write_flag("has_new_year.txt", "false")
          else:
              write_flag("has_pending.txt", "true")
              write_flag("target_year.txt", str(target_year))

              # Modelování legislativního růstu (3.8 % průměrná mzda dle MF ČR, základ NV č. 177/2026 Sb. = 51 663 Kč v roce 2027)
              years_ahead = target_year - 2027
              growth = (1.038) ** max(1, years_ahead)
              avg_wage = round((51663.0 * growth) / 100.0) * 100.0
              threshold = round((36.0 * avg_wage) / 100.0) * 100.0
              min_sp = round((avg_wage * 0.35 * 0.292) / 10.0) * 10.0
              min_zp = round((avg_wage * 0.50 * 0.135) / 10.0) * 10.0
              min_sp_sec = round((avg_wage * 0.11 * 0.292) / 10.0) * 10.0
              sec_limit = round((avg_wage * 2.4) / 100.0) * 100.0
              flat_tier1 = 100.0 + math.ceil(avg_wage * 0.35 * 1.15 * 0.292) + math.ceil(avg_wage * 0.50 * 0.135)

              if existing is None:
                  print(f"Připravuji návrh parametrů pro rok {target_year}...")
                  new_item = {
                      "year": target_year,
                      "incomeTaxRate": 0.15,
                      "progressiveTaxRate": 0.23,
                      "progressiveTaxThreshold": threshold,
                      "taxCreditPerYear": 30840.0,
                      "secondarySocialDecisionLimit": sec_limit,
                      "assessmentBaseRatio": 0.55,
                      "socialSecurityRate": 0.292,
                      "healthInsuranceRate": 0.135,
                      "flatRatePercentage": 0.60,
                      "flatRateMaxExpenseCap": 1200000.0,
                      "assetDepreciationLimit": 80000.0,
                      "vatTurnoverLimit": 2000000.0,
                      "lawReference": f"Předběžná projekce pro rok {target_year} — ověřte s vyhlášeným NV ČR",
                      "lastUpdated": now.strftime("%Y-%m-%d"),
                      "minMonthlySocialAdvancePrimary": min_sp,
                      "minMonthlyHealthAdvancePrimary": min_zp,
                      "minMonthlySocialAdvanceSecondary": min_sp_sec,
                      "flatTaxTier1Monthly": flat_tier1,
                      "flatTaxTier2Monthly": 16745.0,
                      "flatTaxTier3Monthly": 27139.0,
                      "isEnacted": False
                  }
                  data.append(new_item)
                  with open(filepath, "w", encoding="utf-8") as f:
                      json.dump(data, f, ensure_ascii=False, indent=2)
                      f.write("\n")
                  write_flag("has_new_year.txt", "true")
              else:
                  print(f"Rok {target_year} už v JSON existuje, ale má isEnacted: false.")
                  write_flag("has_new_year.txt", "false")
                  avg_wage = round(existing.get("progressiveTaxThreshold", threshold) / 36.0)
                  threshold = existing.get("progressiveTaxThreshold", threshold)
                  min_sp = existing.get("minMonthlySocialAdvancePrimary", min_sp)
                  min_zp = existing.get("minMonthlyHealthAdvancePrimary", min_zp)
                  min_sp_sec = existing.get("minMonthlySocialAdvanceSecondary", min_sp_sec)
                  sec_limit = existing.get("secondarySocialDecisionLimit", sec_limit)
                  flat_tier1 = existing.get("flatTaxTier1Monthly", flat_tier1)

              cssz_hint = probe_official_snippet(
                  "https://www.cssz.cz/web/cz/sazby-pojistneho",
                  rf"({target_year}|minimální záloha|všeobecný vyměřovací základ)"
              )
              vzp_hint = probe_official_snippet(
                  "https://www.vzp.cz/platci/informace/osvc",
                  rf"({target_year}|minimální záloha)"
              )

              with open("summary.txt", "w", encoding="utf-8") as s:
                  s.write(f"### 🏛️ Měsíční kontrola daňové legislativy pro rok {target_year}\n\n")
                  s.write(f"Pro rok **{target_year}** zatím v `tax_constants.json` chybí schválená čísla (`isEnacted: true`).\n\n")
                  s.write(f"* **Orientační průměrná mzda (model +3,8 %):** {int(avg_wage):,} Kč\n")
                  s.write(f"* **Hranice 23% sazby daně (36× mzda):** {int(threshold):,} Kč\n")
                  s.write(f"* **Minimální záloha SP (hlavní):** {int(min_sp):,} Kč/měsíc\n")
                  s.write(f"* **Minimální záloha ZP (hlavní):** {int(min_zp):,} Kč/měsíc\n")
                  s.write(f"* **Minimální záloha SP (vedlejší):** {int(min_sp_sec):,} Kč/měsíc\n")
                  s.write(f"* **Paušální daň 1. pásmo:** {int(flat_tier1):,} Kč/měsíc\n")
                  s.write(f"* **Rozhodná částka vedlejší SP:** {int(sec_limit):,} Kč\n\n")
                  if cssz_hint or vzp_hint:
                      s.write("🔎 **Orientační náhled ze státních webů:**\n")
                      if cssz_hint:
                          s.write(f"* ČSSZ: `...{cssz_hint}...`\n")
                      if vzp_hint:
                          s.write(f"* VZP: `...{vzp_hint}...`\n")
                      s.write("\n")
                  s.write("---\n")
                  s.write("🔗 **Oficiální zdroje pro ověření:**\n")
                  s.write("* ČSSZ (Sazby pojistného a zálohy): https://www.cssz.cz/web/cz/sazby-pojistneho\n")
                  s.write("* VZP (Zálohy OSVČ): https://www.vzp.cz/platci/informace/osvc\n")
                  s.write("* ČSÚ (Průměrná mzda): https://www.czso.cz/csu/czso/prumerne-mzdy\n\n")
                  s.write("👉 Zkontrolujte oficiální vyhlášku, případně upravte hodnoty v Pull Requestu na `\"isEnacted\": true`, a klikněte na **Merge pull request**. Aplikace Kapesní Účetní změnu stáhne automaticky bez vydání updatu v App Storu.")
          EOF

      - name: Vytvořit/aktualizovat PR a poslat měsíční e-mailové upozornění (Issue)
        if: hashFiles('has_pending.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HAS_PENDING=$(cat has_pending.txt)
          if [ "$HAS_PENDING" != "true" ]; then
            echo "Žádné čekající legislativní úpravy."
            exit 0
          fi

          TARGET_YEAR=$(cat target_year.txt)
          BRANCH_NAME="update-legislation-$TARGET_YEAR"

          if [ "$(cat has_new_year.txt)" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B "$BRANCH_NAME"
            git add tax_constants.json
            git commit -m "🏛️ Návrh legislativních parametrů pro rok $TARGET_YEAR"
            git push origin "$BRANCH_NAME" --force || true

            EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --state open --json number -q '.[0].number' || true)
            if [ -z "$EXISTING_PR" ]; then
              gh pr create --title "🏛️ Návrh parametrů pro rok $TARGET_YEAR" \
                           --body-file summary.txt \
                           --base main --head "$BRANCH_NAME" || true
            fi
          fi

          # Otevřít Issue při prvním upozornění, nebo přidat měsíční připomínkový komentář (spustí e-mail)
          PR_URL=$(gh pr list --head "$BRANCH_NAME" --state open --json url -q '.[0].url' || true)
          if [ -n "$PR_URL" ]; then
            printf '\n🔗 **Otevřený Pull Request ke schválení:** %s\n' "$PR_URL" >> summary.txt
          fi

          EXISTING_ISSUE=$(gh issue list --state open --search "rok $TARGET_YEAR in:title" --json number -q '.[0].number' || true)
          if [ -z "$EXISTING_ISSUE" ]; then
            gh issue create --title "📢 Schvalte daňové parametry pro rok $TARGET_YEAR" \
                            --body-file summary.txt \
                            --assignee "${{ github.repository_owner }}" || true
          else
            ISSUE_UPDATED_AT=$(gh issue view "$EXISTING_ISSUE" --json updatedAt -q '.updatedAt' || true)
            SHOULD_REMIND=$(python3 - "$ISSUE_UPDATED_AT" << 'PY'
          import datetime, sys
          raw = sys.argv[1].strip() if len(sys.argv) > 1 else ""
          if not raw:
              print("true")
          else:
              dt = datetime.datetime.fromisoformat(raw.replace("Z", "+00:00"))
              age = (datetime.datetime.now(datetime.timezone.utc) - dt).days
              print("true" if age >= 25 else "false")
          PY
          )
            if [ "$SHOULD_REMIND" = "true" ]; then
              {
                printf '⏰ **Měsíční připomínka (%s):** Parametry pro rok **%s** stále čekají na schválení (`"isEnacted": true`).\n\n' "$(date +%d.%m.%Y)" "$TARGET_YEAR"
                cat summary.txt
              } > reminder.txt
              gh issue comment "$EXISTING_ISSUE" --body-file reminder.txt || true
            else
              echo "Issue #$EXISTING_ISSUE bylo připomenuto před méně než 25 dny, další e-mail přeskočen."
            fi
          fi
